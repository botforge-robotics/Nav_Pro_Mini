# Xbox / XInput-style pad for NavProMini → /cmd_vel
# Hold LB to drive; hold RB for turbo.
teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true

    # Left stick vertical → forward/back
    axis_linear:
      x: 1
    scale_linear:
      x: 0.35
    scale_linear_turbo:
      x: 0.55

    # Left stick horizontal → yaw (standard teleop_twist_joy Xbox mapping)
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.7
    scale_angular_turbo:
      yaw: 1.2

    enable_button: 4        # LB — must hold to move
    enable_turbo_button: 5  # RB
