# DualShock / PS-style mapping → /cmd_vel
# Hold L1 to drive; hold R1 for turbo.
teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true

    axis_linear:
      x: 1
    scale_linear:
      x: 0.35
    scale_linear_turbo:
      x: 0.55

    # Left stick horizontal → yaw
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.7
    scale_angular_turbo:
      yaw: 1.2

    enable_button: 4
    enable_turbo_button: 5
