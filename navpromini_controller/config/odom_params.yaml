# Wheel odometry — encoders only (input to EKF). EKF publishes /odom + TF.
# https://wiki.ros.org/diff_drive_controller
navpromini_odom:
  ros__parameters:
    wheel_radius: 0.0325 # 65 mm diameter
    wheel_separation: 0.225 # 22.5 cm track
    ticks_per_revolution: 1470.0
    # Measured on robot (~7800). Set 0 to use 2*pi*r/ticks_per_rev instead.
    encoder_ticks_per_meter: 7800.0
    odom_frame: odom
    base_frame: base_link
    odom_topic: odom/wheel
    wheel_ticks_topic: wheel_ticks
    imu_topic: imu
    # EKF owns odom→base_link — avoid competing TF publishers
    publish_tf: false
    left_wheel_sign: 1.0
    right_wheel_sign: 1.0
    max_tick_jump: 2000
    # Industrial AMR-style: freeze only when wheel yaw disagrees with IMU gyro
    # (do NOT gate on "body still" — that false-triggers on straight cruise → jumps)
    slip_gate_enable: true
    slip_yaw_err_thresh: 0.55
    slip_v_thresh: 0.06
    slip_gyro_still_thresh: 0.08
    slip_accel_still_thresh: 0.55
    slip_hold_samples: 5
