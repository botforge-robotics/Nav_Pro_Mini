# Wheel odometry — must match firmware + URDF
navpromini_odom:
  ros__parameters:
    wheel_radius: 0.034
    wheel_separation: 0.187
    left_joint_name: LeftWheelJoint
    right_joint_name: RightWheelJoint
    odom_frame: odom
    base_frame: base_link
    odom_topic: odom
    joint_states_topic: joint_states
    publish_tf: true
    left_wheel_sign: 1.0
    right_wheel_sign: 1.0
    # true: stamp /odom + TF with Pi clock (needed for /scan in RViz)
    use_host_time: true
