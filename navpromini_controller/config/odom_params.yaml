# Wheel odometry — encoders only, no IMU fusion. This node owns /odom + TF
# odom→base_link directly (EKF/IMU fusion stage disabled — see robot.launch.py
# start_ekf). Re-enable slip_gate_enable + start_ekf together if IMU is
# reintroduced; the slip gate is a wheel/IMU cross-check, not orientation
# fusion, so it stays off here to keep odom purely encoder-derived.
# https://wiki.ros.org/diff_drive_controller
navpromini_odom:
  ros__parameters:
    wheel_radius: 0.0325 # 65 mm diameter
    wheel_separation: 0.225 # 22.5 cm track
    ticks_per_revolution: 1470.0
    # Measured on robot (~7800). Set 0 to use 2*pi*r/ticks_per_rev instead.
    encoder_ticks_per_meter: 7800.0
    odom_frame: odom
    base_frame: base_link
    odom_topic: odom
    wheel_ticks_topic: wheel_ticks
    imu_topic: imu
    # No EKF stage anymore — this node is the sole /odom + TF publisher.
    publish_tf: true
    left_wheel_sign: 1.0
    right_wheel_sign: 1.0
    max_tick_jump: 2000
    # Encoder-only odom: no IMU cross-check either.
    slip_gate_enable: false
    slip_yaw_err_thresh: 0.55
    slip_v_thresh: 0.06
    slip_gyro_still_thresh: 0.08
    slip_accel_still_thresh: 0.55
    slip_hold_samples: 5
