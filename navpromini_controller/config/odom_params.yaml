# Wheel odometry from ESP32 /wheel_ticks (Rio-style ticks-per-meter).
navpromini_odom:
  ros__parameters:
    # Calibrate: drive 1.0 m straight, read |left+right|/2 tick delta → set here.
    # Geometric estimate for NavPro: 420 ticks/rev / (2*pi*0.034) ≈ 1966
    encoder_ticks_per_meter: 1966.0
    wheel_separation: 0.225
    odom_frame: odom
    base_frame: base_link
    odom_topic: odom
    wheel_ticks_topic: wheel_ticks
    publish_tf: true
    left_wheel_sign: 1.0
    right_wheel_sign: 1.0
