# Official ROS laser self-filter (laser_filters / scan_to_scan_filter_chain).
# Raw lidar: /scan  →  filtered: /scan_filtered (used by Nav2, AMCL, SLAM).
#
# Tune box bounds in base_link if pillars / top deck still appear as obstacles.
# invert: false → remove points INSIDE the box (robot body + pillars).
scan_to_scan_filter_chain:
  ros__parameters:
    # REVERTED — do not set tf_message_filter_target_frame. Setting it to
    # base_link was meant to stop an intermittent self-hit point from
    # slipping through (see git history for that diagnosis, still valid),
    # but live-tested it instead killed /scan_filtered outright: 0 Hz,
    # permanently, vs /scan's healthy 8.3Hz right next to it. Nav2/AMCL both
    # consume /scan_filtered directly, so this took the entire nav stack
    # down (AMCL never got a scan to localize against) — strictly worse
    # than the intermittent self-hit it was meant to fix. If that self-hit
    # is worth chasing again, it needs a fix that's been live-verified to
    # not silently stop the filter chain outputting anything at all.
    filter1:
      name: robot_body_box
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        min_x: -0.12
        max_x: 0.14
        min_y: -0.16
        max_y: 0.16
        min_z: -0.15
        max_z: 0.35
        invert: false
    filter2:
      name: inscribed_footprint
      type: laser_filters/LaserScanFootprintFilter
      params:
        # Match Nav2 robot_radius (0.125 = 25 cm dia) with small margin for pillar legs
        inscribed_radius: 0.13
