# joint_limits.yaml - Calibrated to Waveshare 30kg Serial Bus Servo (ST3215 / STS3215)
# Specs: Stall Torque = 30 kg·cm (2.94 N·m @ 12V), No-load Speed = 45 RPM (0.222s/60° ≈ 4.71 rad/s)

default_velocity_scaling_factor: 0.5
default_acceleration_scaling_factor: 0.5

joint_limits:
  shoulder_pan:
    has_velocity_limits: true
    max_velocity: 4.71
    has_acceleration_limits: true
    max_acceleration: 10.0
  shoulder_lift:
    has_velocity_limits: true
    max_velocity: 4.71
    has_acceleration_limits: true
    max_acceleration: 10.0
  elbow_flex:
    has_velocity_limits: true
    max_velocity: 4.71
    has_acceleration_limits: true
    max_acceleration: 10.0
  wrist_flex:
    has_velocity_limits: true
    max_velocity: 4.71
    has_acceleration_limits: true
    max_acceleration: 12.0
  wrist_roll:
    has_velocity_limits: true
    max_velocity: 4.71
    has_acceleration_limits: true
    max_acceleration: 15.0
  gripper:
    has_velocity_limits: true
    max_velocity: 4.71
    has_acceleration_limits: true
    max_acceleration: 15.0