amcl:
  ros__parameters:
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.25
    alpha4: 0.25
    alpha5: 0.15
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # 8m, not the RPLidar's full 12m. Beyond ~8m indoors the returns are
    # walls already in the map, so the extra range costs CPU in the sensor
    # model without improving the pose estimate.
    laser_max_range: 8.0
    laser_min_range: 0.35
    laser_model_type: "likelihood_field"
    max_beams: 90
    # Cut from 2500/800. AMCL cost is roughly particles x beams, and on a
    # small indoor map 1200 particles localise just as well while leaving CPU
    # for the costmaps — which matters more for obstacle avoidance than
    # particle count does for pose: under load the local costmap was not
    # hitting its configured 5Hz, and a stale costmap is what actually makes
    # the robot hit things.
    max_particles: 1200
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # Slow recovery helps when pose drifts / mislocalizes
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5
    # Off, by request: this auto-seed only ever gets the stack to
    # *attempt* activation off a placeholder (0,0,0) pose — it adds launch
    # time for a self-seed that, live-diagnosed, was not reliably resulting
    # in a real activation anyway (global_costmap stayed inactive waiting
    # on map->odom regardless). A manual Pose Estimate after Start
    # Navigation is the actual real pose either way, so skip the detour and
    # go straight to map-only-loaded until that arrives.
    set_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    # Update pose more often (was too sparse → drift / wrong heading).
    # Tightened for goal accuracy. (Previously reverted alongside the other
    # accuracy tuning below when plain goals started aborting — root cause
    # was actually an unrelated asyncio.sleep crash in dock_manager_node's
    # relay, now fixed, so re-applying this batch.)
    update_min_a: 0.10
    update_min_d: 0.10
    z_hit: 0.7
    z_max: 0.05
    z_rand: 0.25
    z_short: 0.05
    scan_topic: scan_filtered

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    # Pi 5 + DWB: 20 Hz often misses (~10 Hz) → cmd_vel stutter. Hold a rate we can meet.
    controller_frequency: 10.0
    costmap_update_timeout: 0.50
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08
      movement_time_allowance: 45.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Tightened for goal accuracy — see update_min_a comment above.
      xy_goal_tolerance: 0.08
      # 0.12 -> 0.17 by request: final yaw was regularly needing 2-3
      # correction passes to settle inside 0.12rad (~6.9deg) before the goal
      # was accepted. 0.17rad (~9.7deg) still reasonably tight, gives the
      # rotate-to-heading step some room to actually finish in one pass.
      yaw_goal_tolerance: 0.17

    # Regulated Pure Pursuit, not DWB+RotationShim: DWB scores 14x24=336
    # sampled trajectories every cycle, which is real CPU pressure on this
    # Pi (see controller_frequency above) and — measured live — could
    # settle on a DIFFERENT "best" trajectory direction from one cycle to
    # the next when two candidates scored near-equal, producing a
    # back-and-forth hunt: theta oscillated across a ~0.6rad band for 22s
    # with almost no net progress, even with Oscillation critic's own
    # reset thresholds already tightened (0.12m / 0.35rad — this wasn't a
    # loose-default problem). RPP has no competing-candidate-set to flip
    # between: one lookahead point, one curvature, each cycle — and it's
    # geometric rather than sampled, so it's far cheaper to run.
    #
    # DWB+RotationShim is kept below as FollowPathDWB (not in
    # controller_plugins, so unloaded/inert) — to revert, change
    # controller_plugins back to that name.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # == old max_vel_x. velocity_smoother's [0.18, 0, 0.45] stays the
      # fixed safety ceiling above whatever the controller requests,
      # unchanged by this swap.
      desired_linear_vel: 0.135
      # 0.25/0.5 -> 0.15/0.3 by request: RPP steers toward a point AHEAD on
      # the path (the whole pure-pursuit idea), which inherently cuts
      # corners rather than tracking the path exactly — the tighter the
      # turn or the closer to an obstacle, the more it can cut inside the
      # margin Smac2D actually planned for. 0.5m max was over 3x this
      # robot's own body diameter (0.25m); a shorter lookahead makes the
      # arc it draws hug the actual path much more closely, at some cost
      # to how smooth the motion looks.
      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.3
      use_rotate_to_heading: true
      # Both reused as-is from the old RotationShimController tuning above
      # — already field-validated (rotate speed: -20% per request; angle:
      # "was driving straight into doors" below this threshold).
      rotate_to_heading_angular_vel: 0.239
      rotate_to_heading_min_angle: 0.90
      max_angular_accel: 0.55
      # RPP's own default, not the dock's 0.02 — that value is documented
      # elsewhere in this workspace as barely above this robot's own
      # motor breakaway/stall floor, not a speed to steer toward here.
      min_approach_linear_velocity: 0.05
      use_collision_detection: true
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      # Must match local/global costmap inflation_layer.cost_scaling_factor
      # below — this is how RPP reads the cost gradient as real distance.
      inflation_cost_scaling_factor: 3.0
      transform_tolerance: 0.3
      # No reversing in general nav, matches the old min_vel_x: 0.0 — the
      # docking controller owns reverse motion on its own separate path.
      allow_reversing: false

    # Not loaded (absent from controller_plugins above) — kept only so a
    # revert to DWB+RotationShim is a one-line change back to FollowPath.
    FollowPathDWB:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      # ~52° — earlier in-place turn than 1.05 (was driving straight into doors)
      angular_dist_threshold: 0.90
      angular_disengage_threshold: 0.35
      forward_sampling_distance: 0.30
      # In-place rotation speed, -20% (was 0.40) per request.
      rotate_to_heading_angular_vel: 0.239
      max_angular_accel: 0.55
      simulate_ahead_time: 1.0
      rotate_to_heading_once: true
      rotate_to_goal_heading: false
      closed_loop: true

      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      # Navigation velocities: cut 35% from the original, then raised 15%, so
      # they now sit ~25% below where they started (0.18 -> 0.135 etc).
      # min_rotational_vel tracks them: it is the floor the recovery spin
      # uses, and leaving it fixed would make recoveries faster than normal
      # driving.
      #
      # velocity_smoother's max_velocity stays at the original [0.18, 0, 0.45]
      # as a fixed safety ceiling above whatever the controller requests. If
      # these are ever raised past it, the smoother will silently clamp them.
      max_vel_x: 0.135
      max_vel_y: 0.0
      max_vel_theta: 0.337
      min_speed_xy: 0.0
      max_speed_xy: 0.135
      min_speed_theta: 0.0
      max_speed_theta: 0.45
      acc_lim_x: 0.08
      acc_lim_y: 0.0
      acc_lim_theta: 0.40
      decel_lim_x: -0.10
      decel_lim_y: 0.0
      decel_lim_theta: -0.45
      vx_samples: 14
      vy_samples: 1
      vtheta_samples: 24
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.04
      transform_tolerance: 0.3
      # Matches general_goal_checker above (kept in sync in case of a
      # revert back to this block).
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.17
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "PathAlign",
          "PathDist",
          "GoalDist",
        ]
      # PreferForward removed — it kept robot going straight through turns
      # Reverted 14.0 -> 20.0 obstacle-avoidance bump — see update_min_a
      # comment above.
      BaseObstacle.scale: 14.0
      PathAlign.scale: 28.0
      PathAlign.forward_point_distance: 0.28
      PathDist.scale: 36.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 12.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      Oscillation.x_only_threshold: 0.10
      Oscillation.oscillation_reset_dist: 0.12
      Oscillation.oscillation_reset_angle: 0.35

local_costmap:
  local_costmap:
    ros__parameters:
      # 5.0 -> 8.0 by request: a person stepping into the path collided
      # before the robot stopped. At 5Hz, an obstacle can be up to 200ms
      # stale before it even registers here, on top of whatever
      # controller_server/collision_monitor then take to react — 8Hz
      # roughly matches controller_frequency (10Hz below) and cuts that
      # worst case to ~125ms. Real CPU cost; if this alone doesn't fix it,
      # the next lever is FootprintApproach.time_before_collision below,
      # not pushing this further.
      update_frequency: 8.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # 5 -> 6m by request: reacting to a moving obstacle earlier means
      # seeing it earlier, and this rolling window — not obstacle_max_range
      # below, which already reaches 5m from the sensor — is what actually
      # caps that: a dynamic obstacle isn't visible to the local planner or
      # collision_monitor at all until it crosses into this window, i.e.
      # within half its width/height of the robot regardless of scan range.
      # +1m each side is a real CPU cost (~44% more cells at this
      # resolution) — not pushed further without checking it against the
      # controller_frequency=10Hz note above, which already exists because
      # this Pi was missing cycles at the nominal rate.
      width: 6
      height: 6
      resolution: 0.05
      # Physical diameter 25 cm → radius 0.125 m
      # 0.16, not 0.125. The chassis is 260mm across (0.13 radius), so the old
      # value modelled the robot as SMALLER than it is — the planner was
      # allowed to graze walls by 5mm before anything even counted as a
      # collision. 0.16 restores the true radius plus 3cm for the rear camera
      # and mounting hardware. Still leaves a 320mm footprint, comfortable in
      # any doorway.
      robot_radius: 0.16
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # High = cost dies quickly → grey free strip in narrow corridors
        # 3.0, not 10.0. cost_scaling_factor is the exponential decay rate of
        # the inflation cost: at 10.0 the cost collapses within a couple of
        # centimetres of the obstacle, so the planner paid almost nothing for
        # driving right along a wall — which is what clipping corners looks
        # like. A gentler decay spreads the penalty across the whole inflation
        # radius and pushes paths off the walls.
        cost_scaling_factor: 3.0
        # 0.30 still sealed this choke; ~0.20 = body + ~7 cm soft standoff.
        # Nudged 0.25 -> 0.28 by request after two clean, obstacle-free
        # passes tonight gave some confidence there's a little room — still
        # a good margin under the known-bad 0.30, not pushed further without
        # re-testing the narrow choke this history is about.
        inflation_radius: 0.28
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 10
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.16
      resolution: 0.05
      track_unknown_space: true
      # Extra wait if AMCL map TF is late (default ~60s still fails without pose)
      initial_transform_timeout: 120.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Matches local_costmap's inflation_radius — see its comment for why.
        inflation_radius: 0.28
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    # Smac 2D, not NavFn: both are A* over the same inflated costmap, so
    # similar CPU cost — the difference is cost_travel_multiplier below,
    # which lets a nonzero-cost cell be weighted far more than 1:1 against
    # distance during search. NavFn has no equivalent knob, so in a
    # corridor where the inflation gradient doesn't fully bridge the width
    # it just takes whichever side comes out fractionally shorter — this is
    # the standard fix for "path hugs one wall in a narrow corridor" without
    # having to keep pushing inflation_radius (already fought once, see the
    # cost_scaling_factor comment below: pushed too far, it seals doorways
    # shut).
    #
    # NavFn kept below as GridBasedNavFn (not in planner_plugins, so
    # unloaded) — revert by pointing planner_plugins/GridBased back there.
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.10
      allow_unknown: true
      downsample_costmap: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # Default is 2.0. Raised so any costed (near-wall) cell is penalized
      # more heavily relative to raw distance — the direct lever for
      # pulling the path toward the centre of free space instead of
      # whichever side is marginally shorter. 3.0 -> 4.0 by request after
      # two clean passes tonight; still moderate, not pushed further
      # without seeing this value run.
      cost_travel_multiplier: 4.0
      use_final_approach_orientation: false

    # Not loaded (absent from planner_plugins above) — kept only so a
    # revert to NavFn is a one-line change back to GridBased.
    GridBasedNavFn:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # Tightened for goal accuracy — see update_min_a comment above.
      tolerance: 0.10
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Spin recovery in-place rotation speed, -20% (was 0.6/0.25) per request.
    max_rotational_vel: 0.359
    min_rotational_vel: 0.149
    rotational_acc_lim: 0.8

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    # Must match controller_frequency (10 Hz) — mismatch causes accel stair-steps / jerks
    smoothing_frequency: 10.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: True
    feedback: "OPEN_LOOP"
    max_velocity: [0.18, 0.0, 0.45]
    min_velocity: [-0.0, 0.0, -0.45]
    max_accel: [0.10, 0.0, 0.40]
    max_decel: [-0.10, 0.0, -0.45]
    odom_topic: "odom"
    odom_duration: 0.15
    # Do not deadband yaw — small ω was killed → stick then surge
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    # Pass-through node required by Nav2 lifecycle manager.
    # Invalid polygon config leaves collision_monitor unconfigured → bt_navigator never activates.
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Enabled: RPP's own use_collision_detection checks along the
    # path/carrot direction — the right question for forward driving, but
    # it left a gap for a robot rotating near an obstacle, where the risk is
    # the footprint SWEEPING into something during the turn rather than
    # what's ahead of the lookahead point. Confirmed live: the robot
    # physically touched something and stopped mid-turn (near-zero v, small
    # w) on a route RPP's own check had been clean on. FootprintApproach
    # checks the actual footprint sweep continuously regardless of travel
    # direction, closing that gap.
    #
    # Caveat: this reads from scan_filtered, which still carries an
    # unfixed intermittent self-hit at ~0.12m — well inside any reasonable
    # approach threshold. Expect this to make the robot pause more often
    # than strictly necessary until that scan self-hit is actually fixed
    # (see git history — the first attempt at that broke /scan_filtered
    # outright and was reverted). Worst case here is over-caution, not
    # reduced safety, so enabling anyway.
    # SlowdownEarly added alongside FootprintApproach, not in place of it —
    # a separate, earlier-triggering layer rather than touching the config
    # already confirmed working. See SlowdownEarly's own comment below for
    # the radius derivation and why "slowdown" (not "stop") was chosen here
    # after "stop" broke FootprintApproach's configure entirely.
    polygons: ["FootprintApproach", "SlowdownEarly"]
    FootprintApproach:
      type: "polygon"
      # REVERTED to "approach" — live-tested "stop" and it broke configure
      # entirely: collision_monitor stuck unconfigured, which cascaded to
      # bt_navigator/costmaps/everything downstream never activating (this
      # exact cascade is the failure mode this file's own comment above
      # already warns about: "Invalid polygon config leaves
      # collision_monitor unconfigured -> bt_navigator never activates").
      # Restoring the known-working value immediately rather than leaving
      # navigation broken while re-investigating why "stop" specifically
      # doesn't configure on this nav2_collision_monitor build — do not
      # re-attempt "stop" without figuring that out first.
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      # 1.2 -> 1.8s by request: a person stepping in front collided before
      # the robot stopped. More lead time to react/decelerate, at the cost
      # of stopping more cautiously in general.
      time_before_collision: 1.8
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    # Earlier-triggering speed cap, ahead of FootprintApproach's tighter
    # window. A circular zone (not the actual footprint) — simplest, most
    # standard collision_monitor shape, deliberately different plumbing
    # from FootprintApproach so a mistake here doesn't share the exact
    # failure mode that took "stop" down.
    #
    # radius derivation, worked from base_link (collision_monitor already
    # transforms scan points into base_link before testing containment, so
    # no separate lidar-offset correction is needed on this number itself):
    #   radius = forward_obstacle_distance (0.30m, requested) + robot_radius
    #            (0.16m, the costmap's own padded value, not the bare
    #            0.125m physical radius)
    #          = 0.46m
    SlowdownEarly:
      type: "circle"
      action_type: "slowdown"
      radius: 0.46
      slowdown_ratio: 0.5
      min_points: 4
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan_filtered"
      min_height: 0.05
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    # Robot's connector is on the back — approach/dock in reverse, front-out.
    dock_backwards: true
    dock_prestaging_tolerance: 0.5

    # battery_state (relative topic) is remapped to /battery/state in
    # docking.launch.py — battery_node.py publishes there, not on the
    # unremapped default name docking_server expects.

    # Types of docks
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      # Standoff in front of the dock before the final approach segment.
      # Sign confirmed via live test (dock bookmark oriented correctly,
      # robot still staged toward the back of the room) — SimpleChargingDock
      # computes staging_pose = dock_pose + staging_x_offset*(cos yaw, sin
      # yaw) using the dock pose's own yaw; with our convention (yaw = the
      # connector's outward-facing direction), the staging point needs a
      # POSITIVE offset to land out in the room in front of the dock, not
      # negative (which put it behind/into the wall side). Flipped -0.6 ->
      # +0.6, then reduced 0.6 -> 0.3 (was staging further out than wanted,
      # ~60-80cm live) — shorter final approach for the still-flaky
      # lidar-detection segment to cover, closer to the odometry fallback's
      # own effective range too.
      staging_x_offset: 0.3
      use_external_detection_pose: true
      use_battery_status: true
      use_stall_detection: false # true — needs joint_states effort feedback; unverified on this robot

      # Raised from 1.0: the RPLidar A1M8 cannot see closer than its
      # range_min of 0.15m, and the lidar sits only ~0.15m ahead of the
      # robot's rear edge, so detection necessarily drops out right as the
      # dock reaches the robot. 1.0s left no margin for that final blind
      # stretch (mechanical guides + the battery check own it) and a
      # momentary dropout could abort an otherwise-good approach.
      external_detection_timeout: 3.0
      # dock_detector_node publishes detected_dock_pose directly in the dock's
      # own frame convention (X out through the connector, Z up) — no
      # camera/fiducial-mount offset to correct for, unlike the stock example
      # values this repo previously had here (calibrated for a tilted camera).
      external_detection_translation_x: 0.0
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "lidar_1" # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.35
    scan_range_max: 12.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
