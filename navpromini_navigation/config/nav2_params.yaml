amcl:
  ros__parameters:
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.25
    alpha4: 0.25
    alpha5: 0.15
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: true
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 4.0
    laser_max_range: 8.0
    laser_min_range: 0.35
    laser_model_type: "likelihood_field"
    max_beams: 90
    max_particles: 1200
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.15
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 0.5
    set_initial_pose: true
    initial_pose:
      x: -0.13
      y: 0.0
      z: 0.0
      yaw: 0.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.25
    z_short: 0.05
    scan_topic: scan_filtered

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 2000
    wait_for_service_timeout: 2000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 0.50
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 60.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      # 0.17 -> 0.25 (upstream Nav2 example-config default, not a fresh
      # guess): at rotate_to_heading_angular_vel's own floor (~0.178 rad/s,
      # this robot's real wheel breakaway speed), the accel/decel ramp
      # necessarily dwells on sub-floor commands the wheels can't actually
      # produce, so the final heading lands via a stick-slip jump rather
      # than a controlled approach. 0.17 rad was tighter than that jump size
      # can reliably land inside, causing repeated correction attempts
      # ("bump, stop, bump"). This is global (every FollowPath goal on the
      # robot uses general_goal_checker, not just docking staging) because
      # the same wheel-floor physics apply to every in-place rotation.
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.08
      lookahead_dist: 0.25
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.50
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.28
      rotate_to_heading_min_angle: 0.45
      max_angular_accel: 0.22
      use_approach_linear_velocity_scaling: true
      approach_velocity_scaling_dist: 0.60
      min_approach_linear_velocity: 0.05
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.8
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_speed: 0.055
      use_cost_regulated_linear_velocity_scaling: false
      inflation_cost_scaling_factor: 2.2
      transform_tolerance: 0.3
      allow_reversing: false

    FollowPathDWB:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.90
      angular_disengage_threshold: 0.35
      forward_sampling_distance: 0.30
      rotate_to_heading_angular_vel: 0.239
      max_angular_accel: 0.55
      simulate_ahead_time: 1.0
      rotate_to_heading_once: true
      rotate_to_goal_heading: false
      closed_loop: true

      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.135
      max_vel_y: 0.0
      max_vel_theta: 0.337
      min_speed_xy: 0.0
      max_speed_xy: 0.135
      min_speed_theta: 0.0
      max_speed_theta: 0.45
      acc_lim_x: 0.08
      acc_lim_y: 0.0
      acc_lim_theta: 0.40
      decel_lim_x: -0.10
      decel_lim_y: 0.0
      decel_lim_theta: -0.45
      vx_samples: 14
      vy_samples: 1
      vtheta_samples: 24
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.04
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.17
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics:
        [
          "RotateToGoal",
          "Oscillation",
          "BaseObstacle",
          "PathAlign",
          "PathDist",
          "GoalDist",
        ]
      BaseObstacle.scale: 14.0
      PathAlign.scale: 28.0
      PathAlign.forward_point_distance: 0.28
      PathDist.scale: 36.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 12.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      Oscillation.x_only_threshold: 0.10
      Oscillation.oscillation_reset_dist: 0.12
      Oscillation.oscillation_reset_angle: 0.35

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.16
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.2
        inflation_radius: 0.32
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 10
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.16
      resolution: 0.05
      track_unknown_space: true
      initial_transform_timeout: 120.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.2
        inflation_radius: 0.32
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.10
      allow_unknown: true
      downsample_costmap: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 6.0
      use_final_approach_orientation: false

    GridBasedNavFn:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.10
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.359
    min_rotational_vel: 0.149
    rotational_acc_lim: 0.8

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 10.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: True
    feedback: "OPEN_LOOP"
    max_velocity: [0.09, 0.0, 0.35]
    min_velocity: [-0.0, 0.0, -0.35]
    max_accel: [0.11, 0.0, 0.22]
    max_decel: [-0.11, 0.0, -0.25]
    odom_topic: "odom"
    odom_duration: 0.15
    # theta left at its prior values (0.35 ceiling, 0.18/-0.18 accel/decel):
    # rotate_to_heading_angular_vel (0.18) sits right at this robot's real
    # wheel breakaway floor, so the accel-limited ramp asks for several
    # sub-floor angular velocities on the way up and down that the wheels
    # physically can't produce (stiction) — the wheels sit still through
    # those requests, then break loose all at once when the ramp finally
    # crosses the floor, which is the "bump" felt live.
    # deadband_velocity is Nav2's own mechanism for exactly this: values
    # inside the band are commanded as 0 instead, so the smoother stops
    # dwelling in the impossible zone and reaches the floor in one clean
    # step. Left just under 0.18 so cruise speed itself isn't zeroed.
    # x halved for the "reduce autonomous speed" pass (2026-08-29): the
    # linear wheel breakaway floor is ~0.02 m/s (see docking work), so 0.09
    # cruise / 0.11 accel / -0.05 decel still sit comfortably above it —
    # unlike theta, there's no stiction deadband tension here to preserve.
    deadband_velocity: [0.0, 0.0, 0.06]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach", "SlowdownEarly"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.4
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    SlowdownEarly:
      type: "circle"
      action_type: "slowdown"
      radius: 0.40
      slowdown_ratio: 0.75
      min_points: 4
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan_filtered"
      min_height: 0.05
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "lidar_1"
    update_duration: 0.02
    scan_range_min: 0.35
    scan_range_max: 12.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
